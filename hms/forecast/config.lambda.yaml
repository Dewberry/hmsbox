# HMS Forecast Lambda Configuration
# This file is tailored for AWS Lambda where only /tmp is writable.

# Model version to use
model_version: "trinity-v20260509"

# S3 path templates - {year}, {month}, {day}, {hour} will be replaced with actual values
# {S3_BUCKET} will be replaced with HMS_S3_BUCKET environment variable (required)
s3_paths:
  # Model vault path
  model_vault: "s3://{S3_BUCKET}/dev/models/{model_version}.parquet"

  # Forcing data paths
  forcing:
    qpf: "s3://{S3_BUCKET}/staging/temporary/forcing/{year}/{month:02d}/{day:02d}/{hour:02d}/hrrr_qpf.nc"
    temp: "s3://{S3_BUCKET}/staging/temporary/forcing/{year}/{month:02d}/{day:02d}/{hour:02d}/rtma_temp.nc"
    qpe: "s3://{S3_BUCKET}/staging/temporary/forcing/{year}/{month:02d}/{day:02d}/{hour:02d}/mrms_qpe.nc"

  # Observations data path
  observations: "s3://{S3_BUCKET}/staging/temporary/observations/{year}/{month:02d}/{day:02d}/{hour:02d}/gages.dss"

  results:
    lookback_stats: "s3://{S3_BUCKET}/staging/temporary/results/{year}/{month:02d}/{day:02d}/{hour:02d}/stats.parquet"
    forecast_output: "s3://{S3_BUCKET}/staging/temporary/results/{year}/{month:02d}/{day:02d}/{hour:02d}/forecast.parquet"

# Local paths where data will be downloaded (Lambda: must be under /tmp)
local_paths:
  model_dir: "/tmp/model"
  forcing_dir: "/tmp/model/forcing"
  observations_dir: "/tmp/model/observations"

# Predefined datetime modes for testing and validation
# Use --mode flag to select: --mode test, --mode validation1, etc.
# If no mode specified, uses current UTC time
modes:
  test:
    description: "Test mode - uses data from March 11, 2026"
    year: 2026
    month: 3
    day: 11
    hour: 1

  validation1:
    description: "Validation mode 1 - August 21, 2022 - Short duration, high intensity event creating deep water on major arterials"
    year: 2022
    month: 8
    day: 21
    hour: 1

  validation2:
    description: "Validation mode 2 - June 15, 2023 - Medium duration, moderate intensity event causing vehicular flooding"
    year: 2023
    month: 6
    day: 15
    hour: 1

  validation3:
    description: "Validation mode 3 - May 28, 2024 - Long duration event triggering reservoir releases"
    year: 2024
    month: 5
    day: 28
    hour: 1
