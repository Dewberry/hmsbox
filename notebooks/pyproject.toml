[project]
name = "hms-analysis-notebook"
version = "0.1.0"
description = "HMS forecast analysis and visualization notebook"
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.0",
    "jupyterlab>=4.0",
    "nbconvert>=7.0",
    "pandas>=3.0.1",
    "numpy>=1.24.0",
    "matplotlib>=3.8.0",
    "xarray>=2024.0.0",
    "netcdf4>=1.6.0",
    "geopandas>=1.0.0",
    "folium>=0.14.0",
    "pyarrow>=23.0.1",
    "plotly>=5.18.0",
    "imageio>=2.33.0",
    "Pillow>=10.0.0",
    "boto3>=1.38.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
